<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
    <title>Weather App</title>
</head>
<body>
    <header> <h1>Welcome to Weather App!</h1></header>
    <section class="App">
        <div class="container">
        <div class="card">
            <div class="header">
                <input type="text" placeholder="Enter your city" required>
                <div class="img">
                <img src="search.svg" alt="search image">
                </div>
            </div>
            <div class="error">
                <p>Invalid city name</p>
            </div>
            <div class="weather-body">
            <div class="weather-image">
                <img src="rain.png" alt="weather image" width="300px" height="200px">
            </div>
            <div class="default-weather">
            <h1 class="temp">22° C</h1>
            <h1 class="city">New York</h1>
            </div>
            <div class="details">
                <div class="humidity">
                    <img src="humidity.png" alt="humidity" height="50px" width="70px">
                    <div class="p">
                    <p class="percentage">50%</p>
                    <p>Humidity</p>
                    </div>
                </div>
                <div class="wind-speed">
                    <img src="wind.png" alt="wind speed" height="50px" width="70px">
                    <div class="p">
                        <p class="wind">15 km/hr</p>
                    <p>Wind Speed</p>
                    </div>
                </div>
            </div>
            </div>
        </div>
        </div>
    </section>
    <script>
        const apiKey="b6671d0ce4107ecf61baee9c679188a1";
        const apiUrl="https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
        const searchCity=document.querySelector(".header input");
        const searchButton=document.querySelector(".img");
        const weatherImg=document.querySelector(".weather-image img");
        const weatherBody=document.querySelector(".weather-body");
        const weaterReport=async(city)=>{
            const response=await fetch(apiUrl+city+`&appid=${apiKey}`);
            const data=await response.json();
            if(response.status==404){
                document.querySelector(".error").style.display="block";
                weatherBody.style.display="none";

            }
            else{
            document.querySelector(".city").innerHTML=data.name;
            document.querySelector(".temp").innerHTML=Math.round(data.main.temp) + "°C";
            document.querySelector(".percentage").innerHTML=data.main.humidity + "%";
            document.querySelector(".wind").innerHTML=data.wind.speed + "km/hr";
            if(data.weather[0].main=="Clear"){
                    weatherImg.src="clear.png";
            }
            else if(data.weather[0].main=="Clouds"){
                    weatherImg.src="cloud.png";
            }
            else if(data.weather[0].main=="Rain"){
                    weatherImg.src="rain.png";
            }
            else if(data.weather[0].main=="Drizzle"){
                    weatherImg.src="drizzle.png";
            }
            else{
                    weatherImg.src="mist.png";
            }
            weatherBody.style.display="block";
            document.querySelector(".error").style.display="none";
        }}
        searchButton.addEventListener("click",()=>{
            weaterReport(searchCity.value);
        })
        
    </script>
</body>
</html>
